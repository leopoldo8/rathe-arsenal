<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rathe Arsenal</title>

    <!-- Favicon — fraktur "R" emblem from the deckbox logo mark. SVG primary
         (scales to any size), PNG fallbacks for browsers without SVG-favicon
         support, apple-touch-icon for iOS home screen / pinned Safari. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0c0f" />

    <!--
      Synchronous theme initialisation — runs before React hydrates to
      prevent flash-of-wrong-theme. Reads localStorage['rathe-arsenal:theme'],
      whitelists against ['dark','light'] BEFORE writing to dataset.theme,
      then defaults to 'dark' for absent or unknown values.
      The whitelist check precedes any DOM write — tampered storage can never
      reach the attribute.
    -->
    <script>
      (function () {
        var ALLOWED = ['dark', 'light'];
        var raw = null;
        try {
          raw = localStorage.getItem('rathe-arsenal:theme');
        } catch (_) {
          // localStorage may be blocked (private mode / security policy)
        }
        var theme = ALLOWED.indexOf(raw) !== -1 ? raw : 'dark';
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <!-- Google Fonts — preconnect for faster handshake -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />

    <!--
      Google Fonts — Hanken Grotesque (UI), Newsreader (display + ornament,
      superseding Cinzel/Cinzel Decorative), UnifrakturCook (wordmark),
      IBM Plex Serif + JetBrains Mono (retained per FND-01 §3.1/§9 ruling —
      29 and 14 files respectively consume them and the handoff doesn't
      mandate dropping families it never mentions).

      Loaded via the async preload pattern (FND-07: no first-paint block).
      A render-blocking <link rel="stylesheet"> would delay first paint
      until the CSS file fetches; preloading it as a style and swapping
      `rel` to `stylesheet` on load lets the browser paint fallback-font
      text immediately, then swap to the web font when it arrives. The
      <noscript> fallback keeps the blocking behavior for JS-disabled
      clients, who would otherwise never load the fonts at all.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesque:wght@400;500;600;700&family=Newsreader:wght@400;500;600;700;900&family=UnifrakturCook:wght@700&family=IBM+Plex+Serif:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesque:wght@400;500;600;700&family=Newsreader:wght@400;500;600;700;900&family=UnifrakturCook:wght@700&family=IBM+Plex+Serif:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
