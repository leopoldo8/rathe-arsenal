<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Busca | C&uacute;pula do Trov&atilde;o</title>
</head>
<body>
  <form method="get" action="./">
    <input type="hidden" name="view" value="ecom/itens">
    <input type="hidden" name="tcg" value="8">
    <div class="form-group"><label class="control-label">Raridade:</label>
      <select name='txt_raridade' size='1' class='fFiltro form-control input-sm'>
        <option value=''></option><option  value='1'>Token</option><option  value='2'>Common</option><option  value='3'>Rare</option>
      </select></div>
    <div class="form-group"><label class="control-label">Exibir:</label>

        <option value='30'>30</option><option value='60' >60</option><option value='90' >90</option><option value='120' >120</option>
      </select></div>
    <label class="control-check"><input type="checkbox" name="txt_estoque" checked value="1"> Com estoque</label>
    <button class="btn btn-orange" type="submit" name="btFiltrar" value="Filtrar">Filtrar</button>
  </form>
  <div align="center"><div class="alertaErro"><b>Ops!</b> Voc&ecirc; chegou no limite de pagina&ccedil;&atilde;o desta busca. Realize uma busca mais espec&iacute;fica para continuar.</div></div>
