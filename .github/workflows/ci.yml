name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine package (required by API typecheck + tests)
        run: pnpm --filter @rathe-arsenal/engine build

      - name: Unit tests (engine)
        run: pnpm --filter @rathe-arsenal/engine test

      - name: Lint (web) — react/forbid-dom-props blocks inline style={}
        run: pnpm --filter @rathe-arsenal/web lint

      - name: Typecheck (web)
        run: pnpm --filter @rathe-arsenal/web typecheck

      - name: Typecheck (api)
        run: pnpm --filter @rathe-arsenal/api typecheck

      - name: Unit tests (web)
        run: pnpm --filter @rathe-arsenal/web test

      - name: Unit tests (api)
        run: pnpm --filter @rathe-arsenal/api test

      - name: Typecheck and unit tests (smoke runner)
        run: |
          pnpm smoke:typecheck
          pnpm smoke:test

  # Theme persistence E2E and Plan B E2E require a real PostgreSQL database.
  # Runs on every PR using the ephemeral postgres service container.
  e2e:
    name: API E2E (theme persistence + plan-b flow)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: rathe_arsenal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine package
        run: pnpm --filter @rathe-arsenal/engine build

      - name: Run API E2E tests
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://postgres:dev@localhost:5432/rathe_arsenal
          JWT_SECRET: ci-test-jwt-secret-that-is-at-least-32-chars-long
          RESEND_API_KEY: re_test_fake_key_for_ci_bypass
          EMAIL_FROM: CI Test <noreply@test.local>
          APP_BASE_URL: http://localhost:5173
          PORT: "3001"
          EXPOSE_DEV_SECRETS: "true"
        run: pnpm --filter @rathe-arsenal/api test:e2e

  # Browser E2E and the accessibility scan: the full stack (API on :3000, Vite
  # dev server on :5173 proxying /api) against an ephemeral Postgres.
  # TypeORM creates the schema on API boot (NODE_ENV=development).
  web-e2e:
    name: Web E2E (Playwright, axe scan)
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.59 cannot
    # install Chromium. Unpin once Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/rathe_arsenal
      JWT_SECRET: ci-test-jwt-secret-that-is-at-least-32-chars-long
      RESEND_API_KEY: re_test_fake_key_for_ci_bypass
      EMAIL_FROM: CI Test <noreply@test.local>
      APP_BASE_URL: http://localhost:5173
      # The browser tests have no inbox: sign-up and the password code answer with their secrets.
      EXPOSE_DEV_SECRETS: "true"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: rathe_arsenal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine package
        run: pnpm --filter @rathe-arsenal/engine build

      - name: Build API
        run: pnpm --filter @rathe-arsenal/api build

      - name: Install Chromium
        run: pnpm --filter @rathe-arsenal/web exec playwright install --with-deps chromium

      - name: Start API and web dev server
        env:
          PORT: "3000"
        run: |
          node --enable-source-maps apps/api/dist/main.js > api.log 2>&1 &
          (cd apps/web && node scripts/copy-ocr-assets.mjs && exec pnpm exec vite --port 5173 --strictPort) > web.log 2>&1 &

      - name: Wait for API and web
        run: |
          for _ in $(seq 90); do curl -sf -o /dev/null http://localhost:3000/api/health && break; sleep 1; done
          for _ in $(seq 60); do curl -s -o /dev/null http://localhost:5173/ && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3000/api/health
          curl -s -o /dev/null http://localhost:5173/

      - name: Run Playwright E2E
        run: pnpm --filter @rathe-arsenal/web exec playwright test --project=e2e-chromium

      - name: Show server logs on failure
        if: failure()
        run: |
          tail -n 200 api.log || true
          tail -n 200 web.log || true

  # Visual regression suite runs against a live dev server.
  # Skipped in CI at launch per E3 decision — local self-validation tool only.
  # See docs/design/v1/visual-regression.md for the update procedure.
