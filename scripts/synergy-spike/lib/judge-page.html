<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synergy judging</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #14120f;
    --surface: #1d1a16;
    --surface-2: #26221c;
    --line: #3a342b;
    --text: #efe8dc;
    --muted: #a69c8b;
    --accent: #d9a441;
    --yes: #4f9d69;
    --yes-soft: rgba(79, 157, 105, 0.18);
    --no: #c2554a;
    --no-soft: rgba(194, 85, 74, 0.18);
    --pitch-1: #d0463b;
    --pitch-2: #e2b33c;
    --pitch-3: #3f7fd1;
    --radius: 12px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f1e7;
      --surface: #fffdf8;
      --surface-2: #efe8da;
      --line: #dcd2c0;
      --text: #231f19;
      --muted: #6f6656;
      --accent: #a8741a;
      --yes-soft: rgba(79, 157, 105, 0.14);
      --no-soft: rgba(194, 85, 74, 0.14);
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--accent); }
  kbd {
    font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 3px 6px; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; background: var(--surface-2); color: var(--muted);
  }

  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.02em; }
  .progress { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); transition: width 0.25s ease; }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .save-state { font-size: 12px; color: var(--muted); min-width: 64px; text-align: right; }
  .save-state.error { color: var(--no); }

  nav.tabs { display: flex; gap: 8px; padding: 14px 20px 0; overflow-x: auto; }
  .tab {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    white-space: nowrap;
  }
  .tab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tab img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; object-position: 50% 18%; }
  .tab .meta { display: flex; flex-direction: column; text-align: left; line-height: 1.25; }
  .tab .meta small { color: var(--muted); font-size: 12px; }
  .tab .done { color: var(--yes); }

  main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; padding: 16px 20px 28px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { order: 2; } }

  aside { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; align-self: start; position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; }
  aside h2 { font-size: 14px; margin: 0 0 2px; }
  aside .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .hero-card { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .hero-card img { width: 64px; border-radius: 6px; }
  .decklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .decklist li { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 4px; border-radius: 6px; }
  .decklist li:hover { background: var(--surface-2); }
  .decklist .qty { color: var(--muted); width: 18px; text-align: right; font-variant-numeric: tabular-nums; }
  .pip { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--line); }
  .pip.p1 { background: var(--pitch-1); } .pip.p2 { background: var(--pitch-2); } .pip.p3 { background: var(--pitch-3); }
  .preview { position: fixed; pointer-events: none; width: 220px; border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); display: none; z-index: 20; }

  .stage { display: grid; grid-template-columns: minmax(220px, 360px) minmax(0, 1fr); gap: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  @media (max-width: 700px) { .stage { grid-template-columns: 1fr; } }
  .art { width: 100%; border-radius: 14px; aspect-ratio: 450 / 628; object-fit: cover; background: var(--surface-2); }
  .missing { display: grid; place-items: center; text-align: center; padding: 6px; font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 6px; aspect-ratio: 450 / 628; }
  .details { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .position { color: var(--muted); font-size: 13px; }
  .details h2 { font-size: 26px; line-height: 1.15; margin: 0; }
  .typeline { color: var(--muted); }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat { padding: 4px 10px; border-radius: 99px; background: var(--surface-2); font-size: 13px; }
  .stat.p1 { background: var(--pitch-1); color: #fff; } .stat.p2 { background: var(--pitch-2); color: #2a2205; } .stat.p3 { background: var(--pitch-3); color: #fff; }
  .rules { white-space: pre-wrap; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font-size: 15px; }
  .rules .sym { font-weight: 600; color: var(--accent); }
  .question { font-weight: 600; }
  .votes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .vote { padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 16px; display: flex; justify-content: center; align-items: center; gap: 10px; transition: transform 0.08s ease; }
  .vote:active { transform: scale(0.98); }
  .vote.yes[aria-pressed="true"] { background: var(--yes-soft); border-color: var(--yes); color: var(--yes); }
  .vote.no[aria-pressed="true"] { background: var(--no-soft); border-color: var(--no); color: var(--no); }
  .nav-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ghost { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
  .hints { color: var(--muted); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; }

  .strip { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; }
  .thumb { position: relative; padding: 0; border: 2px solid transparent; border-radius: 8px; background: none; }
  .thumb img { width: 100%; display: block; border-radius: 6px; aspect-ratio: 450 / 628; object-fit: cover; background: var(--surface-2); }
  .thumb[aria-current="true"] { border-color: var(--accent); }
  .thumb .badge { position: absolute; right: 4px; bottom: 4px; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 99px; }
  .thumb .badge.yes { background: var(--yes); color: #fff; } .thumb .badge.no { background: var(--no); color: #fff; }
  .thumb.judged img { opacity: 0.55; }
  .done-panel { text-align: center; padding: 48px 20px; }
  .done-panel h2 { margin-top: 0; }
  .loading { padding: 60px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Synergy judging</h1>
  <div class="progress"><div class="bar"><span id="bar"></span></div><span id="progress-label"></span></div>
  <label class="toggle"><input type="checkbox" id="pending-only"> Pending only</label>
  <span class="save-state" id="save-state" role="status"></span>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="main"><div class="loading">Loading sheet...</div></main>
<img class="preview" id="preview" alt="">

<script>
const state = { decks: [], rows: [], deck: null, index: 0, pendingOnly: false };
const $ = (id) => document.getElementById(id);

const escapeHtml = (text) => text.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const SYMBOLS = { p: 'power', d: 'defense', r: 'resource', i: 'intellect', h: 'life', c: 'cost' };
function formatRules(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\{([a-z])\}/g, (match, key) => SYMBOLS[key] ? `<span class="sym">${SYMBOLS[key]}</span>` : match);
}

function imageSources(image, size) {
  if (!image) return [];
  return image.sources.map((source) => source[size]);
}
function imgTag(image, size, className, alt) {
  const sources = imageSources(image, size);
  if (sources.length === 0) return `<div class="${className} missing">${escapeHtml(alt)}</div>`;
  return `<img class="${className}" src="${sources[0]}" data-sources='${JSON.stringify(sources)}' data-i="0" alt="${escapeHtml(alt)}" loading="lazy">`;
}
document.addEventListener('error', (event) => {
  const img = event.target;
  if (!(img instanceof HTMLImageElement) || !img.dataset.sources) return;
  const sources = JSON.parse(img.dataset.sources);
  const next = Number(img.dataset.i) + 1;
  if (next < sources.length) { img.dataset.i = String(next); img.src = sources[next]; return; }
  const fallback = document.createElement('div');
  fallback.className = `${img.className} missing`;
  fallback.textContent = img.alt;
  img.replaceWith(fallback);
}, true);

const deckRows = (deck) => state.rows.filter((row) => row.deck === deck);
const visibleRows = () => deckRows(state.deck).filter((row) => !state.pendingOnly || row.verdict === '' || row === current());
const current = () => deckRows(state.deck)[state.index];

function renderHeader() {
  const judged = state.rows.filter((row) => row.verdict !== '').length;
  $('bar').style.width = `${state.rows.length ? (judged / state.rows.length) * 100 : 0}%`;
  $('progress-label').textContent = `${judged} / ${state.rows.length} judged`;
  $('tabs').innerHTML = state.decks.map((deck) => {
    const rows = deckRows(deck.deck);
    const done = rows.filter((row) => row.verdict !== '').length;
    const heroSrc = imageSources(deck.hero.image, 'small')[0] ?? '';
    return `<button class="tab" role="tab" aria-selected="${deck.deck === state.deck}" data-deck="${deck.deck}">
      ${heroSrc ? `<img src="${heroSrc}" alt="">` : ''}
      <span class="meta"><span>${escapeHtml(deck.name)}</span><small class="${done === rows.length ? 'done' : ''}">${escapeHtml(deck.hero.name)} · ${done}/${rows.length}</small></span>
    </button>`;
  }).join('');
}

function renderAside(deck) {
  const list = [...deck.mainboard].sort((a, b) => a.name.localeCompare(b.name));
  return `<aside>
    <h2>${escapeHtml(deck.name)}</h2>
    <div class="sub">${escapeHtml(deck.format)} · <a href="${deck.url}" target="_blank" rel="noopener">Fabrary</a></div>
    <div class="hero-card">${imgTag(deck.hero.image, 'small', '', deck.hero.name)}<div><strong>${escapeHtml(deck.hero.name)}</strong><div class="sub" style="margin:0">Hero</div></div></div>
    <ul class="decklist">${list.map((card) => `<li data-preview='${JSON.stringify(imageSources(card.image, 'small'))}'>
      <span class="qty">${card.quantity}</span><span class="pip ${card.pitch ? 'p' + card.pitch : ''}"></span><span>${escapeHtml(card.name)}</span></li>`).join('')}</ul>
  </aside>`;
}

function renderStage(deck) {
  const rows = deckRows(deck.deck);
  const row = current();
  if (!row) return '<section class="stage"><div class="done-panel"><h2>No cards for this deck</h2></div></section>';
  const pending = rows.filter((r) => r.verdict === '').length;
  const stats = [
    row.pitch ? `<span class="stat p${row.pitch}">pitch ${row.pitch}</span>` : '',
    row.cost !== null ? `<span class="stat">cost ${row.cost}</span>` : '',
    row.power !== null ? `<span class="stat">power ${row.power}</span>` : '',
    row.defense !== null ? `<span class="stat">defense ${row.defense}</span>` : '',
  ].join('');
  const strip = visibleRows().map((r) => {
    const i = rows.indexOf(r);
    const badge = r.verdict ? `<span class="badge ${r.verdict}">${r.verdict}</span>` : '';
    return `<button class="thumb ${r.verdict ? 'judged' : ''}" data-index="${i}" aria-current="${i === state.index}" title="${escapeHtml(r.name)}">${imgTag(r.image, 'small', '', r.name)}${badge}</button>`;
  }).join('');
  return `<div>
    <section class="stage">
      ${imgTag(row.image, 'large', 'art', row.name)}
      <div class="details">
        <div class="position">Card ${state.index + 1} of ${rows.length} · ${pending} pending in this deck</div>
        <h2>${escapeHtml(row.name)}</h2>
        <div class="typeline">${escapeHtml(row.typeLine)}</div>
        <div class="stats">${stats}</div>
        ${row.rules ? `<div class="rules">${formatRules(row.rules)}</div>` : ''}
        <div class="question">Would you consider putting this card in ${escapeHtml(deck.name)}?</div>
        <div class="votes">
          <button class="vote yes" data-vote="yes" aria-pressed="${row.verdict === 'yes'}">Yes <kbd>Y</kbd></button>
          <button class="vote no" data-vote="no" aria-pressed="${row.verdict === 'no'}">No <kbd>N</kbd></button>
        </div>
        <div class="nav-row">
          <button class="ghost" data-move="-1">Previous</button>
          <button class="ghost" data-move="1">Next</button>
          <button class="ghost" data-vote="">Clear vote</button>
        </div>
        <div class="hints"><span><kbd>Y</kbd> <kbd>N</kbd> vote</span><span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> move</span><span><kbd>Backspace</kbd> clear</span><span><kbd>1</kbd>-<kbd>3</kbd> deck</span></div>
      </div>
    </section>
    <div class="strip">${strip}</div>
  </div>`;
}

function render() {
  renderHeader();
  const deck = state.decks.find((d) => d.deck === state.deck);
  if (!deck) return;
  $('main').innerHTML = renderAside(deck) + renderStage(deck);
}

function selectDeck(deck) {
  state.deck = deck;
  const rows = deckRows(deck);
  const firstPending = rows.findIndex((row) => row.verdict === '');
  state.index = firstPending === -1 ? 0 : firstPending;
  render();
}

function move(step) {
  const rows = deckRows(state.deck);
  const candidates = rows.map((row, i) => i).filter((i) => !state.pendingOnly || rows[i].verdict === '' || i === state.index);
  const position = candidates.indexOf(state.index);
  const next = candidates[position + step];
  if (next !== undefined) { state.index = next; render(); }
}

function nextPendingAfter(index) {
  const rows = deckRows(state.deck);
  for (let offset = 1; offset <= rows.length; offset++) {
    const i = (index + offset) % rows.length;
    if (rows[i].verdict === '') return i;
  }
  return null;
}

async function vote(verdict) {
  const row = current();
  if (!row) return;
  const previous = row.verdict;
  row.verdict = verdict;
  $('save-state').className = 'save-state';
  $('save-state').textContent = 'Saving...';
  render();
  try {
    const response = await fetch('/api/verdict', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ deck: row.deck, card: row.card, verdict }),
    });
    if (!response.ok) throw new Error((await response.json()).error ?? response.statusText);
    $('save-state').textContent = 'Saved';
    if (verdict !== '') {
      const next = nextPendingAfter(state.index);
      if (next !== null) state.index = next;
      render();
    }
  } catch (error) {
    row.verdict = previous;
    $('save-state').className = 'save-state error';
    $('save-state').textContent = `Not saved: ${error.message}`;
    render();
  }
}

document.addEventListener('click', (event) => {
  const target = event.target.closest('[data-vote], [data-move], [data-index], [data-deck]');
  if (!target) return;
  if (target.dataset.vote !== undefined) vote(target.dataset.vote);
  else if (target.dataset.move) move(Number(target.dataset.move));
  else if (target.dataset.index) { state.index = Number(target.dataset.index); render(); }
  else if (target.dataset.deck) selectDeck(target.dataset.deck);
});

document.addEventListener('keydown', (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey || event.target instanceof HTMLInputElement) return;
  const key = event.key.toLowerCase();
  if (key === 'y') vote('yes');
  else if (key === 'n') vote('no');
  else if (key === 'backspace') { event.preventDefault(); vote(''); }
  else if (key === 'arrowright') move(1);
  else if (key === 'arrowleft') move(-1);
  else if (/^[1-9]$/.test(key) && state.decks[Number(key) - 1]) selectDeck(state.decks[Number(key) - 1].deck);
});

$('pending-only').addEventListener('change', (event) => { state.pendingOnly = event.target.checked; render(); });

document.addEventListener('mouseover', (event) => {
  const item = event.target.closest('[data-preview]');
  const preview = $('preview');
  const sources = item ? JSON.parse(item.dataset.preview) : [];
  if (!sources.length) { preview.style.display = 'none'; return; }
  preview.src = sources[0];
  const rect = item.getBoundingClientRect();
  preview.style.left = `${rect.right + 12}px`;
  preview.style.top = `${Math.min(rect.top, window.innerHeight - 320)}px`;
  preview.style.display = 'block';
});

fetch('/api/sheet')
  .then((response) => response.json())
  .then((payload) => {
    state.decks = payload.decks.filter((deck) => payload.rows.some((row) => row.deck === deck.deck));
    state.rows = payload.rows;
    const firstPending = state.decks.find((deck) => deckRows(deck.deck).some((row) => row.verdict === '')) ?? state.decks[0];
    if (firstPending) selectDeck(firstPending.deck);
  })
  .catch((error) => { $('main').innerHTML = `<div class="loading">Could not load the sheet: ${escapeHtml(error.message)}</div>`; });
</script>
</body>
</html>
